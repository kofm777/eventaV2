name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Tests (Laravel)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_mysql
          coverage: none

      - name: Prepare environment
        run: |
          cd backend
          cp .env.example .env
          # Deterministically point the test suite at the MySQL service.
          # The example DB name is 'event_access', so a plain match-on-value
          # sed is fragile -- match the whole KEY= line instead, and append
          # any key that is somehow absent.
          set_env() {
            local key="$1" val="$2"
            if grep -qE "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${val}|" .env
            else
              echo "${key}=${val}" >> .env
            fi
          }
          set_env DB_CONNECTION mysql
          set_env DB_HOST 127.0.0.1
          set_env DB_PORT 3306
          set_env DB_DATABASE testing
          set_env DB_USERNAME root
          set_env DB_PASSWORD password

      - name: Install dependencies
        run: |
          cd backend
          composer install --prefer-dist --no-progress --no-interaction

      - name: Generate application key
        run: |
          cd backend
          php artisan key:generate

      - name: Run tests
        run: |
          cd backend
          php artisan test

  backend-docker-build:
    name: Backend Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: eventaccess-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-code-quality:
    name: Backend Code Quality (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: |
          cd backend
          composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style (Pint)
        # Advisory only: surfaces style drift without failing the pipeline. The real
        # gate is the backend-tests job. (Run `vendor/bin/pint` locally to auto-fix.)
        continue-on-error: true
        run: |
          cd backend
          vendor/bin/pint --test
