<div class="badge-container">
  <div class="badge-header">
    <h1>Event Access - Badge</h1>
    <p class="success-message">Inscription réussie !</p>
  </div>

  <div class="badge-content">
    <div class="participant-info">
      <h2>{{ participantName }}</h2>
      <p class="email-status">
        <span *ngIf="emailSent" class="email-sent">✓ Email envoyé avec succès</span>
        <span *ngIf="!emailSent" class="email-failed">⚠ Erreur lors de l'envoi de l'email</span>
      </p>
    </div>

    <div class="qr-section">
      <div class="qr-code-container">
        <img *ngIf="qrCode" [src]="'data:image/png;base64,' + qrCode" alt="QR Code" class="qr-code" />
      </div>
      <p class="qr-instruction">Présentez ce QR code à l'entrée de l'événement</p>
    </div>

    <div class="actions">
      <button (click)="downloadQR()" class="btn btn-primary">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
          <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
        </svg>
        Télécharger QR
      </button>
      <button (click)="printQR()" class="btn btn-secondary">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/>
          <path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2H5zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4V3zm1 5a2 2 0 0 0-2 2v1H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v-1a2 2 0 0 0-2-2H5zm7 2v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1z"/>
        </svg>
        Imprimer
      </button>
    </div>

    <div class="register-another">
      <button (click)="registerAnother()" class="btn btn-outline">
        Inscrire une autre personne
      </button>
    </div>
  </div>
</div>
