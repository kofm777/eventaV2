<div class="container">
  <div class="login-container">
    <div class="card">
      <div class="login-header">
        <h2>Admin Login</h2>
        <p class="subtitle">Access the admin panel</p>
      </div>

      <div *ngIf="error" class="alert alert-error">
        {{ error }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input
            type="email"
            id="email"
            class="form-control"
            formControlName="email"
            [class.error]="submitted && f['email'].errors"
            placeholder="admin@example.com"
            autocomplete="email"
          />
          <div *ngIf="submitted && f['email'].errors" class="error-message">
            <span *ngIf="f['email'].errors['required']">Email is required</span>
            <span *ngIf="f['email'].errors['email']">Invalid email format</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            formControlName="password"
            [class.error]="submitted && f['password'].errors"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <div *ngIf="submitted && f['password'].errors" class="error-message">
            <span *ngIf="f['password'].errors['required']">Password is required</span>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-large" [disabled]="loading">
            <span *ngIf="!loading">Login</span>
            <span *ngIf="loading">Logging in...</span>
          </button>
        </div>
      </form>

      <div class="login-footer">
        <p class="default-credentials">
          <strong>Default credentials:</strong><br>
          Email: admin&#64;example.com<br>
          Password: admin123
        </p>
      </div>
    </div>
  </div>
</div>
